<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgreeBill Hub - Live Dynamic Contract & Billing System</title>
  
  <!-- React and ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel standalone to compile JSX directly in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2pdf.js for vector-perfect PDF exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Tailwind Configuration for Custom Utilities -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontSize: {
            'xxs': '0.65rem',
          }
        }
      }
    }
  </script>

  <!-- Clean stylesheet overrides for layout preview and native printing -->
  <style>
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .page-break-after {
        page-break-after: always;
        break-after: page;
      }
      header, section.print\:hidden, div.print\:hidden, footer {
        display: none !important;
      }
    }
    /* Simple CSS slide-in animation for toast notifications */
    @keyframes slideIn {
      from {
        transform: translateY(-1rem);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .animate-slide-in {
      animation: slideIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- Root mount node for React -->
  <div id="root"></div>

  <!-- React JSX Application Script -->
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Pure date formatting helper function
    const formatDateString = (dateStr) => {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    };

    // Pre-defined Project Types & their custom agreement modifications + invoice defaults
    const PROJECT_PRESETS = {
      'web-design': {
        title: 'Website Design & Development',
        scope: 'Services include website design, logo integration, branding, navigation planning, responsive design, development of up to five pages, testing, deployment, and basic security implementation.',
        revisionTerms: 'The Client is entitled to 3 rounds of revisions within 7 calendar days after delivery. Additional revisions or redesign requests may incur additional charges.',
        pageOverageTerms: 'The project includes a maximum of five pages. Additional pages are charged at £100.00 per page excluding VAT. Additional functionality and services may be quoted separately.',
        acceptanceTerms: 'The Client has 7 calendar days to test and review the website. If no significant issues are reported, the website shall be deemed accepted and responsibility transfers to the Client.',
        securityTerms: 'The Service Provider will implement industry-standard security measures at launch. However, website security is an ongoing process and no website can be guaranteed completely secure.',
        liabilityTerms: 'The Service Provider shall not be liable for loss of profits, revenue, business opportunities, data, or downtime occurring after project acceptance.',
        items: [
          { id: 1, description: 'Website Design (Custom Logo, Wireframes, Brand Color Palette, Typography)', amount: 300.00 },
          { id: 2, description: 'Website Structure & Development Setup (HTML/CSS/JS, up to 5 responsive pages)', amount: 80.00 }
        ],
        defaultAdditionalFee: 100,
        unitName: 'page'
      },
      'maintenance-admin': {
        title: 'Ongoing Maintenance & Admin Support',
        scope: 'Services encompass scheduled database sanitization, malware/bloatware removal ("cleaning"), plugin & theme core dependency updates, administrative server management, hosting transfers, and content editing tasks.',
        revisionTerms: 'Technical cleaning tasks and modifications will be carried out on staging copies. The Client is entitled to 2 iterative verification checks per billing cycle to confirm page structural integrity.',
        pageOverageTerms: 'This monthly administrative arrangement includes up to 8 hours of dedicated maintenance. Out-of-scope emergencies or emergency server restorations are billed flatly at £65.00/hour.',
        acceptanceTerms: 'Monthly maintenance reports, detailing speed diagnostics and database cleanup protocols, are delivered on the 1st of each month. Deliverables are accepted unless flagged within 48 hours.',
        securityTerms: 'The Service Provider implements secure database sweeps, security log audits, and regular firewalls. Cleaned sites are hardened, though vulnerabilities from newly installed external assets are the Client\'s risk.',
        liabilityTerms: 'Service Provider is not responsible for hosting provider downtime, DNS resolution delays beyond standard registrar times, or third-party backup service storage failures.',
        items: [
          { id: 1, description: 'Deep Code Clean & Speed Optimization (Malware sweep, database indexing & obsolete resource cleanup)', amount: 150.00 },
          { id: 2, description: 'Recurring Admin Support & Content Management Retainer (Plugin patches, hosting supervision, & edits)', amount: 120.00 }
        ],
        defaultAdditionalFee: 65,
        unitName: 'hour'
      },
      'app-development': {
        title: 'Mobile Application Development',
        scope: 'Services include UI/UX app layout design, RESTful API endpoint integration, user authentication state setup, local databases, push notification setups, and beta build compilation for iOS & Android.',
        revisionTerms: 'The Client is entitled to 2 complete design revisions of wireframes prior to codebase implementation. Any alterations requested post-compilation will be treated as paid feature requests.',
        pageOverageTerms: 'This project includes standard modular feature modules. Additional custom integrations (e.g., custom payment gateways or third-party CRM syncs) are billed at £150.00 per feature point.',
        acceptanceTerms: 'The Client has 10 calendar days to perform User Acceptance Testing (UAT). If no blocking critical issues are filed in writing, the app build will be marked officially approved for store release.',
        securityTerms: 'Service Provider implements secure API handshakes, hashed passwords, and tokenized credentials. App store approval guidelines must be followed, though ultimate approval is at store owners\' discretion.',
        liabilityTerms: 'Under no circumstances will the Service Provider be responsible for store rejections, runtime API failures of third-party platforms, or user credential database exploits post-deployment.',
        items: [
          { id: 1, description: 'Mobile App Wireframes, Visual Architecture & UI Component Design Assets', amount: 500.00 },
          { id: 2, description: 'Native Core Compilation & Framework Integration (iOS & Android distribution package)', amount: 850.00 }
        ],
        defaultAdditionalFee: 150,
        unitName: 'feature'
      },
      'graphic-design': {
        title: 'Brand Identity & Graphic Design',
        scope: 'Services encompass creation of a cohesive visual identity system including master logos, secondary locks, high-fidelity brand guideline sheets, business cards, and social media layout presets.',
        revisionTerms: 'The Client is provided up to 4 iterative feedback rounds on selected brand concepts. Additional design revisions or completely new conceptual drafts will be subject to supplementary graphic hours.',
        pageOverageTerms: 'Includes master logo formats and assets. Extra collateral items (such as full stationery sheets or slide deck templates) will be billed at £75.00 per individual brand asset item.',
        acceptanceTerms: 'Once high-resolution vector and source deliverables are signed off and supplied via shared digital assets, the branding assets shall be considered final, fully accepted, and completed.',
        securityTerms: 'Service Provider warrants that designs are original creations and do not knowingly violate pre-existing visual trademarks. Final trademark clearance and registration are the Client’s responsibility.',
        liabilityTerms: 'Service Provider is not liable for intellectual property disputes, printing costs, sizing anomalies in print layouts, or marketing impact resulting from design implementation.',
        items: [
          { id: 1, description: 'Visual Strategy & Custom Core Logo Design (Includes Vector Formats & Asset Pack)', amount: 250.00 },
          { id: 2, description: 'Brand Guidelines Playbook (Color rules, typography pairings, social templates)', amount: 150.00 }
        ],
        defaultAdditionalFee: 75,
        unitName: 'asset'
      }
    };

    function App() {
      // Main State
      const [projectType, setProjectType] = useState('web-design');
      const [agreementTitle, setAgreementTitle] = useState(PROJECT_PRESETS['web-design'].title);
      
      // Party Details
      const [providerName, setProviderName] = useState('Angelo Candma');
      const [providerTitle, setProviderTitle] = useState('DevOps & Lead Engineer');
      const [providerAddress, setProviderAddress] = useState('Unit 12A, 12th Floor, The Grand Towers, 790 Pablo Ocampo St., Malate, Manila 1004 Metro Manila, Philippines');
      
      const [clientName, setClientName] = useState('Stephen Warry');
      const [clientCompany, setClientCompany] = useState('Warry Enterprises');
      const [clientAddress, setClientAddress] = useState('71 Cherry Tree Lane, Richmond, London, TW9 1XF, UK');
      
      // Key Dates & Document References
      const [effectiveDate, setEffectiveDate] = useState('2026-06-08');
      const [dueDate, setDueDate] = useState('2026-06-22');
      const [invoiceNumber, setInvoiceNumber] = useState('INV-001');
      const [currencySymbol, setCurrencySymbol] = useState('£');
      const [vatRate, setVatRate] = useState(12);

      // Custom Editable Agreement Clauses
      const [scopeText, setScopeText] = useState(PROJECT_PRESETS['web-design'].scope);
      const [revisionsText, setRevisionsText] = useState(PROJECT_PRESETS['web-design'].revisionTerms);
      const [overageText, setOverageText] = useState(PROJECT_PRESETS['web-design'].pageOverageTerms);
      const [acceptanceText, setAcceptanceText] = useState(PROJECT_PRESETS['web-design'].acceptanceTerms);
      const [securityText, setSecurityText] = useState(PROJECT_PRESETS['web-design'].securityTerms);
      const [liabilityText, setLiabilityText] = useState(PROJECT_PRESETS['web-design'].liabilityTerms);

      // Dynamic Maintenance/Cleaning/Admin toggles
      const [hasCleaningAddon, setHasCleaningAddon] = useState(false);
      const [hasBackupAddon, setHasBackupAddon] = useState(false);
      const [hasAdminAddon, setHasAdminAddon] = useState(false);

      // Dynamic Invoice line items state
      const [invoiceItems, setInvoiceItems] = useState(PROJECT_PRESETS['web-design'].items);
      const [newItemDesc, setNewItemDesc] = useState('');
      const [newItemAmount, setNewItemAmount] = useState('');

      // App UI State
      const [activeTab, setActiveTab] = useState('all'); // 'all', 'agreement', 'invoice'
      const [notification, setNotification] = useState(null);
      const [isPdfLoading, setIsPdfLoading] = useState(false);

      // Signatures State
      const [providerSignature, setProviderSignature] = useState(null);
      const [clientSignature, setClientSignature] = useState(null);

      // Signature canvas refs
      const providerCanvasRef = useRef(null);
      const clientCanvasRef = useRef(null);
      const fileInputRef = useRef(null);

      // Sync canvases if signature variables are imported/restored
      useEffect(() => {
        if (providerSignature && providerCanvasRef.current) {
          const img = new Image();
          img.onload = () => {
            const canvas = providerCanvasRef.current;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = providerSignature;
        }
      }, [providerSignature]);

      useEffect(() => {
        if (clientSignature && clientCanvasRef.current) {
          const img = new Image();
          img.onload = () => {
            const canvas = clientCanvasRef.current;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = clientSignature;
        }
      }, [clientSignature]);

      // Update dynamic fields when preset type changes
      const handlePresetChange = (type) => {
        const preset = PROJECT_PRESETS[type];
        if (preset) {
          setProjectType(type);
          setAgreementTitle(preset.title);
          setScopeText(preset.scope);
          setRevisionsText(preset.revisionTerms);
          setOverageText(preset.pageOverageTerms);
          setAcceptanceText(preset.acceptanceTerms);
          setSecurityText(preset.securityTerms);
          setLiabilityText(preset.liabilityTerms);
          
          setHasCleaningAddon(false);
          setHasBackupAddon(false);
          setHasAdminAddon(false);

          setInvoiceItems(preset.items);
          showNotification(`Switched to ${preset.title} Preset!`);
        }
      };

      const showNotification = (message) => {
        setNotification(message);
        setTimeout(() => {
          setNotification(null);
        }, 3500);
      };

      const toggleAddon = (addonType, cost, description) => {
        if (addonType === 'cleaning') {
          const active = !hasCleaningAddon;
          setHasCleaningAddon(active);
          updateAddonLineItem(active, description, cost);
        } else if (addonType === 'backup') {
          const active = !hasBackupAddon;
          setHasBackupAddon(active);
          updateAddonLineItem(active, description, cost);
        } else if (addonType === 'admin') {
          const active = !hasAdminAddon;
          setHasAdminAddon(active);
          updateAddonLineItem(active, description, cost);
        }
      };

      const updateAddonLineItem = (shouldAdd, desc, amt) => {
        if (shouldAdd) {
          const newItem = {
            id: `addon-${desc.replace(/\s+/g, '-').toLowerCase()}`,
            description: desc,
            amount: amt
          };
          setInvoiceItems(prev => [...prev, newItem]);
          showNotification(`Added ${desc} to Invoice.`);
        } else {
          setInvoiceItems(prev => prev.filter(item => item.id !== `addon-${desc.replace(/\s+/g, '-').toLowerCase()}`));
          showNotification(`Removed ${desc} from Invoice.`);
        }
      };

      const calculateSubtotal = () => {
        return invoiceItems.reduce((acc, item) => acc + parseFloat(item.amount || 0), 0);
      };

      const calculateVAT = () => {
        return calculateSubtotal() * (vatRate / 100);
      };

      const calculateTotal = () => {
        return calculateSubtotal() + calculateVAT();
      };

      const addInvoiceItem = () => {
        if (!newItemDesc.trim()) {
          showNotification('Please enter an item description.');
          return;
        }
        const amt = parseFloat(newItemAmount);
        if (isNaN(amt) || amt < 0) {
          showNotification('Please enter a valid positive amount.');
          return;
        }

        const newItem = {
          id: Date.now(),
          description: newItemDesc,
          amount: amt
        };

        setInvoiceItems([...invoiceItems, newItem]);
        setNewItemDesc('');
        setNewItemAmount('');
        showNotification('Line item added to invoice.');
      };

      const removeInvoiceItem = (id) => {
        if (invoiceItems.length <= 1) {
          showNotification('Invoice must retain at least one line item.');
          return;
        }
        setInvoiceItems(invoiceItems.filter(item => item.id !== id));
        showNotification('Item removed.');
      };

      // Canvas Drawing Signature Logic
      const startDrawing = (e, canvasRef) => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#1e293b';
        
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        canvas.isDrawing = true;
      };

      const draw = (e, canvasRef) => {
        const canvas = canvasRef.current;
        if (!canvas.isDrawing) return;
        
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        
        if (e.touches) {
          e.preventDefault();
        }
      };

      const stopDrawing = (canvasRef, saveCallback) => {
        const canvas = canvasRef.current;
        if (canvas.isDrawing) {
          canvas.isDrawing = false;
          saveCallback(canvas.toDataURL());
        }
      };

      const clearSignature = (canvasRef, saveCallback) => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveCallback(null);
        showNotification('Signature cleared.');
      };

      // Export State to JSON file
      const handleExportData = () => {
        const contractState = {
          projectType,
          agreementTitle,
          providerName,
          providerTitle,
          providerAddress,
          clientName,
          clientCompany,
          clientAddress,
          effectiveDate,
          dueDate,
          invoiceNumber,
          currencySymbol,
          vatRate,
          scopeText,
          revisionsText,
          overageText,
          acceptanceText,
          securityText,
          liabilityText,
          hasCleaningAddon,
          hasBackupAddon,
          hasAdminAddon,
          invoiceItems,
          providerSignature,
          clientSignature,
          exportedAt: new Date().toISOString()
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(contractState, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `AgreeBill_${invoiceNumber || 'Contract'}_${clientName.replace(/\s+/g, '_')}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showNotification("Contract structure & signatures exported successfully!");
      };

      // Import State from JSON file
      const handleImportData = (event) => {
        const fileReader = new FileReader();
        const file = event.target.files[0];
        if (!file) return;

        fileReader.onload = (e) => {
          try {
            const importedState = JSON.parse(e.target.result);
            
            if (importedState.projectType) setProjectType(importedState.projectType);
            if (importedState.agreementTitle) setAgreementTitle(importedState.agreementTitle);
            if (importedState.providerName) setProviderName(importedState.providerName);
            if (importedState.providerTitle) setProviderTitle(importedState.providerTitle);
            if (importedState.providerAddress) setProviderAddress(importedState.providerAddress);
            if (importedState.clientName) setClientName(importedState.clientName);
            if (importedState.clientCompany) setClientCompany(importedState.clientCompany);
            if (importedState.clientAddress) setClientAddress(importedState.clientAddress);
            if (importedState.effectiveDate) setEffectiveDate(importedState.effectiveDate);
            if (importedState.dueDate) setDueDate(importedState.dueDate);
            if (importedState.invoiceNumber) setInvoiceNumber(importedState.invoiceNumber);
            if (importedState.currencySymbol) setCurrencySymbol(importedState.currencySymbol);
            if (importedState.vatRate !== undefined) setVatRate(importedState.vatRate);
            
            if (importedState.scopeText) setScopeText(importedState.scopeText);
            if (importedState.revisionsText) setRevisionsText(importedState.revisionsText);
            if (importedState.overageText) setOverageText(importedState.overageText);
            if (importedState.acceptanceText) setAcceptanceText(importedState.acceptanceText);
            if (importedState.securityText) setSecurityText(importedState.securityText);
            if (importedState.liabilityText) setLiabilityText(importedState.liabilityText);
            
            setHasCleaningAddon(!!importedState.hasCleaningAddon);
            setHasBackupAddon(!!importedState.hasBackupAddon);
            setHasAdminAddon(!!importedState.hasAdminAddon);

            if (Array.isArray(importedState.invoiceItems)) setInvoiceItems(importedState.invoiceItems);
            
            if (importedState.providerSignature) setProviderSignature(importedState.providerSignature);
            if (importedState.clientSignature) setClientSignature(importedState.clientSignature);

            showNotification("Contract successfully imported!");
          } catch (err) {
            console.error("Invalid state file uploaded.", err);
            showNotification("Failed to parse file.");
          }
        };
        fileReader.readAsText(file);
        event.target.value = '';
      };

      const triggerFileInput = () => {
        fileInputRef.current.click();
      };

      const handleDownloadPDF = async () => {
        if (!window.html2pdf) {
          showNotification("PDF system loading...");
          return;
        }

        setIsPdfLoading(true);
        showNotification("Generating PDF...");

        const element = document.getElementById('contract-document-package');
        const filename = `Agreement_Invoice_${invoiceNumber || 'INV-001'}_${clientName.replace(/\s+/g, '_')}.pdf`;

        const opt = {
          margin:       [4, 4, 4, 4],
          filename:     filename,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { 
            scale: 2, 
            useCORS: true, 
            logging: false,
            letterRendering: true,
            backgroundColor: '#FFFFFF'
          },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak:    { mode: ['css', 'legacy'] }
        };

        try {
          await window.html2pdf().set(opt).from(element).save();
          showNotification("PDF successfully downloaded!");
        } catch (error) {
          console.error("PDF generation failed: ", error);
          showNotification("Direct PDF process failed. Opening Print instead.");
          window.print();
        } finally {
          setIsPdfLoading(false);
        }
      };

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col print:bg-white print:text-black">
          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-4 right-4 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 border border-slate-700 animate-slide-in">
              <svg className="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span className="text-sm font-medium">{notification}</span>
            </div>
          )}

          {/* Primary Header */}
          <header className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-40 shadow-xs print:hidden">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-indigo-600 text-white rounded-lg">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900 tracking-tight">AgreeBill Hub</h1>
                  <p className="text-xs text-slate-500 font-medium">Dynamic Agreements, Upkeeps & Multi-country File Exchange</p>
                </div>
              </div>
              
              <div className="flex flex-wrap items-center gap-3">
                <div>
                  <label className="block text-xxs font-bold uppercase tracking-wider text-slate-400 mb-1">Preset Template Type</label>
                  <select
                    value={projectType}
                    onChange={(e) => handlePresetChange(e.target.value)}
                    className="bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                    <option value="web-design">🌐 Website Design & Development</option>
                    <option value="maintenance-admin">🔧 Support, Cleaning & Maintenance</option>
                    <option value="app-development">📱 Mobile Application Dev</option>
                    <option value="graphic-design">🎨 Brand Identity & Graphic Design</option>
                  </select>
                </div>

                <div className="flex gap-2 mt-4 md:mt-0">
                  <button
                    onClick={handleDownloadPDF}
                    disabled={isPdfLoading}
                    className="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-400 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm"
                  >
                    {isPdfLoading ? 'Assembling...' : 'Download Final PDF'}
                  </button>

                  <button
                    onClick={handlePrint}
                    className="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm"
                  >
                    Print Document
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Studio Viewport */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 print:block print:p-0">
            
            {/* LEFT COLUMN: Controls Panel */}
            <section className="lg:col-span-5 space-y-6 print:hidden">
              
              {/* ASYNCHRONOUS EXPORT & IMPORT FILE EXCHANGE SYSTEM */}
              <div className="bg-slate-900 text-white rounded-xl p-5 shadow-md space-y-3.5 border border-slate-800">
                <div>
                  <span className="inline-block bg-indigo-500 text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded mb-1">
                    Collaboration Engine
                  </span>
                  <h2 className="text-sm font-black text-white flex items-center gap-1.5 uppercase tracking-wide">
                    Asynchronous Remote Signing
                  </h2>
                  <p className="text-xxs text-slate-300 mt-1 leading-normal">
                    No web servers needed. Fill out your details, apply your signature, and export the file. Your overseas client can then upload the data file, sign on their computer, and download the finished PDF.
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={handleExportData}
                    className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-2.5 text-xs font-bold transition-all border border-slate-700 shadow-sm"
                  >
                    Export Contract Data
                  </button>

                  <button
                    type="button"
                    onClick={triggerFileInput}
                    className="flex items-center justify-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg p-2.5 text-xs font-bold transition-all shadow-sm"
                  >
                    Import Contract Data
                  </button>
                </div>

                <input
                  type="file"
                  ref={fileInputRef}
                  onChange={handleImportData}
                  accept=".json"
                  className="hidden"
                />
              </div>
              
              {/* Party 1 & 2 Config */}
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs space-y-4">
                <h2 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-2 flex items-center gap-2">
                  <span className="w-5 h-5 flex items-center justify-center bg-indigo-100 text-indigo-700 rounded text-xs font-bold">1</span>
                  Parties & Key Details
                </h2>
                
                <div className="space-y-3">
                  <div>
                    <h3 className="text-xs font-semibold uppercase text-indigo-600 mb-1">Service Provider</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        value={providerName}
                        onChange={(e) => setProviderName(e.target.value)}
                        placeholder="Name"
                        className="border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-medium"
                      />
                      <input
                        type="text"
                        value={providerTitle}
                        onChange={(e) => setProviderTitle(e.target.value)}
                        placeholder="Title/Department"
                        className="border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full"
                      />
                    </div>
                    <textarea
                      value={providerAddress}
                      onChange={(e) => setProviderAddress(e.target.value)}
                      placeholder="Provider Business Address"
                      className="mt-1.5 border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full h-14 resize-none"
                    />
                  </div>

                  <div className="border-t border-slate-100 pt-3">
                    <h3 className="text-xs font-semibold uppercase text-emerald-600 mb-1">Client</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="text"
                        value={clientName}
                        onChange={(e) => setClientName(e.target.value)}
                        placeholder="Name"
                        className="border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-medium"
                      />
                      <input
                        type="text"
                        value={clientCompany}
                        onChange={(e) => setClientCompany(e.target.value)}
                        placeholder="Company"
                        className="border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full"
                      />
                    </div>
                    <textarea
                      value={clientAddress}
                      onChange={(e) => setClientAddress(e.target.value)}
                      placeholder="Client Address"
                      className="mt-1.5 border border-slate-200 rounded px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 w-full h-14 resize-none"
                    />
                  </div>

                  <div className="border-t border-slate-100 pt-3 grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-0.5">Effective Date</label>
                      <input
                        type="date"
                        value={effectiveDate}
                        onChange={(e) => setEffectiveDate(e.target.value)}
                        className="border border-slate-200 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-medium"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-0.5">Due Date</label>
                      <input
                        type="date"
                        value={dueDate}
                        onChange={(e) => setDueDate(e.target.value)}
                        className="border border-slate-200 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-medium"
                      />
                    </div>
                  </div>
                </div>
              </div>

              {/* Maintenance & Admin Addon upkeeps */}
              <div className="bg-gradient-to-br from-indigo-50 to-white rounded-xl border border-indigo-200/80 p-5 shadow-xs space-y-4">
                <div>
                  <h2 className="text-sm font-extrabold text-slate-900 uppercase tracking-tight">Maintenance, Cleaning & Admin Upgrades</h2>
                  <p className="text-xxs text-slate-500 mt-1 leading-normal">
                    Dynamically append structured maintenance services directly onto your invoice and insert an interactive Clause 13 in the formal legal framework below.
                  </p>
                </div>

                <div className="space-y-3">
                  <label className="flex items-start gap-3 p-3 rounded-lg border border-slate-200 bg-white hover:border-indigo-300 transition-all cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={hasCleaningAddon}
                      onChange={() => toggleAddon('cleaning', 120.00, 'Security sweep, deep code cleaning, malware mitigation, & file audit')}
                      className="mt-1 h-4.5 w-4.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    />
                    <div>
                      <div className="flex justify-between items-center w-full">
                        <span className="text-xs font-bold text-slate-800">Deep Cleaning & Security Sweep</span>
                        <span className="text-xs font-mono font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">+£120.00</span>
                      </div>
                      <p className="text-xxs text-slate-400 mt-0.5 leading-normal">
                        Purge inactive database lines, conduct continuous software scans, optimize files, and patch active security leaks.
                      </p>
                    </div>
                  </label>

                  <label className="flex items-start gap-3 p-3 rounded-lg border border-slate-200 bg-white hover:border-indigo-300 transition-all cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={hasBackupAddon}
                      onChange={() => toggleAddon('backup', 80.00, 'Routine Theme & Plugin core maintenance support with automated nightly backups')}
                      className="mt-1 h-4.5 w-4.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    />
                    <div>
                      <div className="flex justify-between items-center w-full">
                        <span className="text-xs font-bold text-slate-800">Routine Maintenance & Backups</span>
                        <span className="text-xs font-mono font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">+£80.00</span>
                      </div>
                      <p className="text-xxs text-slate-400 mt-0.5 leading-normal">
                        Check update dependencies, execute visual snapshot trials, and schedule nightly cloud storage backups.
                      </p>
                    </div>
                  </label>

                  <label className="flex items-start gap-3 p-3 rounded-lg border border-slate-200 bg-white hover:border-indigo-300 transition-all cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={hasAdminAddon}
                      onChange={() => toggleAddon('admin', 150.00, 'Administrative Support Package (5 hours of dedicated content editing & DNS/Server changes)')}
                      className="mt-1 h-4.5 w-4.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    />
                    <div>
                      <div className="flex justify-between items-center w-full">
                        <span className="text-xs font-bold text-slate-800">Dedicated Admin Support Bundle</span>
                        <span className="text-xs font-mono font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded">+£150.00</span>
                      </div>
                      <p className="text-xxs text-slate-400 mt-0.5 leading-normal">
                        Secure 5 monthly admin assistance hours for DNS updates and content adjustments.
                      </p>
                    </div>
                  </label>
                </div>
              </div>

              {/* Dynamic Clauses Customizer */}
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs space-y-4">
                <h2 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">Tailor Legal Clauses</h2>
                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Clause 1: Scope of Services</label>
                    <textarea value={scopeText} onChange={(e) => setScopeText(e.target.value)} className="w-full border border-slate-200 rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500 h-16"/>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Clause 4: Design Revisions Window</label>
                    <textarea value={revisionsText} onChange={(e) => setRevisionsText(e.target.value)} className="w-full border border-slate-200 rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500 h-16"/>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Clause 5: Overages & Variable Charges</label>
                    <textarea value={overageText} onChange={(e) => setOverageText(e.target.value)} className="w-full border border-slate-200 rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500 h-16"/>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Clause 6: Period of Acceptance Testing</label>
                    <textarea value={acceptanceText} onChange={(e) => setAcceptanceText(e.target.value)} className="w-full border border-slate-200 rounded p-2 text-xs focus:ring-1 focus:ring-indigo-500 h-16"/>
                  </div>
                </div>
              </div>

              {/* Live Invoice items */}
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs space-y-4">
                <h2 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">Live Invoice Items & VAT</h2>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-xxs font-semibold text-slate-400 uppercase">Invoice #</label>
                    <input type="text" value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} className="border border-slate-200 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-mono font-bold" />
                  </div>
                  <div>
                    <label className="block text-xxs font-semibold text-slate-400 uppercase">Currency</label>
                    <select value={currencySymbol} onChange={(e) => setCurrencySymbol(e.target.value)} className="border border-slate-200 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 w-full bg-transparent font-medium">
                      <option value="£">£ (GBP)</option>
                      <option value="$">$ (USD)</option>
                      <option value="€">€ (EUR)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xxs font-semibold text-slate-400 uppercase">VAT Rate (%)</label>
                    <input type="number" value={vatRate} onChange={(e) => setVatRate(Math.max(0, parseFloat(e.target.value) || 0))} className="border border-slate-200 rounded px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 w-full font-bold" min="0" />
                  </div>
                </div>

                <div className="space-y-2">
                  <span className="block text-xs font-bold text-slate-700">Add Custom Invoice Line:</span>
                  <div className="grid grid-cols-12 gap-2">
                    <input type="text" value={newItemDesc} onChange={(e) => setNewItemDesc(e.target.value)} placeholder="Description" className="col-span-8 border border-slate-200 rounded px-2 py-1.5 text-xs focus:ring-1" />
                    <input type="number" value={newItemAmount} onChange={(e) => setNewItemAmount(e.target.value)} placeholder="0.00" className="col-span-4 border border-slate-200 rounded px-2 py-1.5 text-xs focus:ring-1" />
                  </div>
                  <button type="button" onClick={addInvoiceItem} className="w-full bg-slate-950 text-white text-xs font-semibold py-1.5 rounded">Add Line Item</button>
                </div>

                <div className="divide-y divide-slate-100 max-h-44 overflow-y-auto">
                  {invoiceItems.map((item) => (
                    <div key={item.id} className="flex justify-between items-center py-2 text-xs">
                      <span className="truncate max-w-[70%]">{item.description}</span>
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-bold">{currencySymbol}{item.amount.toFixed(2)}</span>
                        <button type="button" onClick={() => removeInvoiceItem(item.id)} className="text-red-500">×</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Digital Signatures */}
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-xs space-y-4">
                <h2 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">Legal Digital Signatures</h2>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <span className="text-xs font-bold block mb-1">Provider:</span>
                    <div className="border border-dashed border-slate-300 rounded bg-slate-50 relative">
                      <canvas ref={providerCanvasRef} width={200} height={80} onMouseDown={(e) => startDrawing(e, providerCanvasRef)} onMouseMove={(e) => draw(e, providerCanvasRef)} onMouseUp={() => stopDrawing(providerCanvasRef, setProviderSignature)} onMouseLeave={() => stopDrawing(providerCanvasRef, setProviderSignature)} className="w-full h-20" />
                      <button onClick={() => clearSignature(providerCanvasRef, setProviderSignature)} className="absolute right-1 top-1 text-[9px] text-red-500">Clear</button>
                    </div>
                  </div>

                  <div>
                    <span className="text-xs font-bold block mb-1">Client:</span>
                    <div className="border border-dashed border-slate-300 rounded bg-slate-50 relative">
                      <canvas ref={clientCanvasRef} width={200} height={80} onMouseDown={(e) => startDrawing(e, clientCanvasRef)} onMouseMove={(e) => draw(e, clientCanvasRef)} onMouseUp={() => stopDrawing(clientCanvasRef, setClientSignature)} onMouseLeave={() => stopDrawing(clientCanvasRef, setClientSignature)} className="w-full h-20" />
                      <button onClick={() => clearSignature(clientCanvasRef, setClientSignature)} className="absolute right-1 top-1 text-[9px] text-red-500">Clear</button>
                    </div>
                  </div>
                </div>
              </div>

            </section>

            {/* RIGHT COLUMN: Interactive High-Fidelity A4 Document Preview */}
            <section className="lg:col-span-7 flex flex-col space-y-4 print:w-full print:block">
              <div className="bg-white border border-slate-200 rounded-lg p-1.5 flex justify-between gap-1 shadow-xs print:hidden">
                <div className="flex gap-1">
                  <button onClick={() => setActiveTab('all')} className={`px-3 py-1.5 text-xs font-bold rounded-md ${activeTab === 'all' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Combined Package</button>
                  <button onClick={() => setActiveTab('agreement')} className={`px-3 py-1.5 text-xs font-bold rounded-md ${activeTab === 'agreement' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Agreement Only</button>
                  <button onClick={() => setActiveTab('invoice')} className={`px-3 py-1.5 text-xs font-bold rounded-md ${activeTab === 'invoice' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>Invoice Only</button>
                </div>
              </div>

              {/* Live Preview Paper */}
              <div className="bg-slate-150 p-2 md:p-6 rounded-2xl border border-slate-300/60 flex flex-col items-center justify-start print:bg-white print:border-none">
                <div id="contract-document-package" className="w-full max-w-[210mm] space-y-6">
                  
                  {/* Agreement Page */}
                  {(activeTab === 'all' || activeTab === 'agreement') && (
                    <div className="bg-white text-slate-900 p-8 md:p-12 w-full min-h-[297mm] shadow-lg print:shadow-none page-break-after flex flex-col justify-between">
                      <div className="space-y-5">
                        <div className="flex justify-between items-start border-b-2 border-slate-900 pb-4">
                          <div>
                            <h2 className="text-xl md:text-2xl font-black uppercase text-slate-950">Service Agreement</h2>
                            <p className="text-[11px] font-bold text-indigo-700 tracking-wider mt-1">Project: {agreementTitle}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-xs font-semibold text-slate-500">Effective Date</p>
                            <p className="text-sm font-bold text-slate-950">{formatDateString(effectiveDate)}</p>
                          </div>
                        </div>

                        <p className="text-[12px] leading-relaxed text-slate-700">
                          This {agreementTitle} Service Agreement ("Agreement") is entered into between <strong>{providerName}</strong> ("Service Provider") and <strong>{clientName}</strong> ("Client"), representing <strong>{clientCompany}</strong>. Effective Date: {formatDateString(effectiveDate)}.
                        </p>

                        <div className="space-y-3.5 text-xs">
                          <div>
                            <h3 className="font-extrabold text-slate-950">1. Purpose of Agreement</h3>
                            <p className="text-[11px] text-slate-600">The purpose of this Agreement is to establish terms for delivering {projectType} assets.</p>
                          </div>
                          <div>
                            <h3 className="font-extrabold text-slate-950">2. Scope of Services</h3>
                            <p className="text-[11px] text-slate-600">{scopeText}</p>
                          </div>
                          <div>
                            <h3 className="font-extrabold text-slate-950">3. Design Revisions</h3>
                            <p className="text-[11px] text-slate-600">{revisionsText}</p>
                          </div>
                          <div>
                            <h3 className="font-extrabold text-slate-950">4. Acceptance Terms</h3>
                            <p className="text-[11px] text-slate-600">{acceptanceText}</p>
                          </div>
                          <div>
                            <h3 className="font-extrabold text-slate-950">5. Security Setup</h3>
                            <p className="text-[11px] text-slate-600">{securityText}</p>
                          </div>
                          <div>
                            <h3 className="font-extrabold text-slate-950">6. Limitation of Liability</h3>
                            <p className="text-[11px] text-slate-600">{liabilityText}</p>
                          </div>

                          {/* Dynamic Maintenance and Admin Upgrade details */}
                          {(hasCleaningAddon || hasBackupAddon || hasAdminAddon) && (
                            <div className="p-3 bg-indigo-50 border border-indigo-100 rounded">
                              <h3 className="font-extrabold text-indigo-950 uppercase text-[11px]">13. Support, Cleaning & Administrative Addendum</h3>
                              <ul className="list-disc pl-4 mt-1 text-[10px] text-slate-700 space-y-1">
                                {hasCleaningAddon && <li><strong>Deep Cleaning & Sanitization:</strong> Core malware dependencies sweep and database optimization.</li>}
                                {hasBackupAddon && <li><strong>Routine Maintenance & Backups:</strong> Redundant nightly secure backup execution.</li>}
                                {hasAdminAddon && <li><strong>Dedicated Admin Support:</strong> Standard monthly content management hours.</li>}
                              </ul>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Execution Signatures */}
                      <div className="mt-8 border-t border-slate-200 pt-5">
                        <div className="grid grid-cols-2 gap-8 text-xs">
                          <div>
                            <p className="font-bold text-slate-900">Service Provider:</p>
                            <div className="h-14 border-b border-slate-350 flex items-center justify-center">
                              {providerSignature ? <img src={providerSignature} className="max-h-full max-w-full" alt="Provider signature" /> : <span className="text-slate-300 italic text-[11px]">Pending Signature</span>}
                            </div>
                            <p className="font-bold mt-1">{providerName}</p>
                            <p className="text-[10px] text-slate-400">Date: {formatDateString(effectiveDate)}</p>
                          </div>
                          <div>
                            <p className="font-bold text-slate-900">Client:</p>
                            <div className="h-14 border-b border-slate-350 flex items-center justify-center">
                              {clientSignature ? <img src={clientSignature} className="max-h-full max-w-full" alt="Client signature" /> : <span className="text-slate-300 italic text-[11px]">Pending Signature</span>}
                            </div>
                            <p className="font-bold mt-1">{clientName}</p>
                            <p className="text-[10px] text-slate-400">Date: {formatDateString(effectiveDate)}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Invoice Page */}
                  {(activeTab === 'all' || activeTab === 'invoice') && (
                    <div className="bg-white text-slate-900 p-8 md:p-12 w-full min-h-[297mm] shadow-lg print:shadow-none flex flex-col justify-between">
                      <div className="space-y-6">
                        <div className="flex justify-between items-start border-b-2 border-slate-900 pb-4">
                          <div>
                            <h2 className="text-2xl font-black uppercase">Invoice</h2>
                            <p className="text-xs font-mono text-slate-500">No. {invoiceNumber}</p>
                          </div>
                          <div className="text-right text-xs">
                            <p className="font-bold">{providerName}</p>
                            <p className="text-slate-500 max-w-[200px] text-[10px]">{providerAddress}</p>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-4 text-xs">
                          <div>
                            <p className="font-bold text-slate-400">Bill To:</p>
                            <p className="font-bold">{clientName}</p>
                            <p className="text-slate-500 text-[10px]">{clientAddress}</p>
                          </div>
                          <div className="text-right text-[11px]">
                            <p>Date: {formatDateString(effectiveDate)}</p>
                            <p className="font-bold text-indigo-700">Due Date: {formatDateString(dueDate)}</p>
                          </div>
                        </div>

                        {/* Invoicing list */}
                        <table className="w-full text-left text-xs border-collapse">
                          <thead>
                            <tr className="border-b-2 border-slate-300 font-bold text-slate-500">
                              <th className="py-2">Description</th>
                              <th className="py-2 text-right">Amount</th>
                            </tr>
                          </thead>
                          <tbody>
                            {invoiceItems.map((item) => (
                              <tr key={item.id} className="border-b border-slate-100">
                                <td className="py-2">{item.description}</td>
                                <td className="py-2 text-right font-mono font-bold">{currencySymbol}{item.amount.toFixed(2)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        <div className="flex justify-end pt-4">
                          <div className="w-64 space-y-1.5 text-xs">
                            <div className="flex justify-between">
                              <span className="text-slate-500">Subtotal:</span>
                              <span className="font-mono font-bold">{currencySymbol}{calculateSubtotal().toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between">
                              <span className="text-slate-500">VAT ({vatRate}%):</span>
                              <span className="font-mono">{currencySymbol}{calculateVAT().toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between border-t-2 border-slate-900 pt-2 font-black text-sm">
                              <span>Total Due:</span>
                              <span className="text-indigo-700">{currencySymbol}{calculateTotal().toFixed(2)}</span>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="border-t border-slate-100 pt-6 text-[10px] text-slate-400">
                        <p className="font-bold">Thank you for your business.</p>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </section>
          </main>
        </div>
      );
    }

    // Render App inside Babel context
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
